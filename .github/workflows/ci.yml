name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # caching pip dependencies

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # We install requirements. 
        # Note: llama-cpp-python might need build tools, but wheels are often available.
        # If build fails, we might need 'sudo apt-get install cmake' etc.
        pip install -r requirements.txt

    - name: Run Tests
      # We create a dummy .env for tests if it doesn't exist, 
      # though config tests mock the env vars.
      run: |
        cp .env.example .env
        pytest tests/
