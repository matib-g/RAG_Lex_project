# Production Docker Compose for OCI deployment
# Backend API only (frontend is hosted on GitHub Pages)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: rag_lex_api:latest
    container_name: rag_lex_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Data persistence - mount from host
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./vectordb:/app/vectordb
    env_file:
      - .env.production
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: rag_lex_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  nginx:
    image: nginx:alpine
    container_name: rag_lex_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app

volumes:
  redis_data:
