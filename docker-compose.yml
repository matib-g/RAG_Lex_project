version: '3.8'

services:
  app:
    build: .
    image: rag_lex_project:latest
    container_name: rag_lex_app
    ports:
      - "8000:8000"
    volumes:
      # Data persistance
      - ./data:/app/data
      - ./models:/app/models
      - ./vectordb:/app/vectordb
      # Development: mount source code for live reload (optional, good for dev)
      - ./src:/app/src
      - ./main.py:/app/main.py
    # Load environment variables from .env
    env_file:
      - .env
    # Keep container running for interactive commands
    tty: true
    stdin_open: true
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis

  frontend:
    build: .
    image: rag_lex_project:latest
    container_name: rag_lex_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./data:/app/data
      - ./models:/app/models
      - ./vectordb:/app/vectordb
    env_file:
      - .env
    environment:
      - API_URL=http://app:8000
    command: streamlit run src/ui/app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    container_name: rag_lex_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
